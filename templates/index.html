<!DOCTYPE html>
<html>
<head>
    <title>Secure Journal App</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
        }

        .navbar {
            background: linear-gradient(to right, #8e2de2, #4a00e0, #2193b0);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .hero {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .hero h2 {
            font-size: 40px;
            color: #222;
        }

        .hero span {
            color: #8e2de2;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-top: 0;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 15px;
        }

        textarea {
            height: 120px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(to right, #8e2de2, #2193b0);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.02);
            opacity: 0.95;
        }

        .entries {
            margin-top: 30px;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .entry {
            background: #f7f7ff;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: gray;
        }

    </style>
</head>

<body>

    <div class="navbar">
        <h1>📖 Secure Journal</h1>
        <h3>Secure • Private • Protected</h3>
    </div>

    <div class="container">

        <div class="hero">
            <h2>Welcome to Your <span>Secure Journal</span></h2>
            <p>Write freely. Store safely. Access securely.</p>
        </div>

        <div class="cards">

            <div class="card">

                <h3>🔐 Authentication</h3>

                <input type="text" id="register-username" placeholder="Register Username">
                <input type="password" id="register-password" placeholder="Register Password">

                <button onclick="register()">Register</button>

                <br><br>

                <input type="text" id="login-username" placeholder="Login Username">
                <input type="password" id="login-password" placeholder="Login Password">

                <button onclick="login()">Login</button>

            </div>

            <div class="card">

                <h3>📝 Create Journal Entry</h3>

                <input type="text" id="title" placeholder="Title">

                <textarea id="content" placeholder="Write your thoughts here..."></textarea>

                <button onclick="createEntry()">Create Entry</button>

            </div>

            <div class="card">

                <h3>📚 Your Entries</h3>

                <button onclick="loadEntries()">Load Entries</button>

                <div id="entries"></div>

            </div>

        </div>

    </div>

    <div class="footer">
        © 2026 Secure Journal DevSecOps Project
    </div>

<script>

let token = ""

async function register() {

    const username = document.getElementById("register-username").value
    const password = document.getElementById("register-password").value

    const response = await fetch("/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username,
            password
        })
    })

    const data = await response.json()

    alert(JSON.stringify(data))
}

async function login() {

    const username = document.getElementById("login-username").value
    const password = document.getElementById("login-password").value

    const response = await fetch("/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username,
            password
        })
    })

    const data = await response.json()

    token = data.token

    alert("Login successful")
}

async function createEntry() {

    const title = document.getElementById("title").value
    const content = document.getElementById("content").value

    const response = await fetch("/entries", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": token
        },
        body: JSON.stringify({
            title,
            content
        })
    })

    const data = await response.json()

    alert(JSON.stringify(data))
}

async function loadEntries() {

    const response = await fetch("/entries", {
        headers: {
            "Authorization": token
        }
    })

    const data = await response.json()

    const entriesDiv = document.getElementById("entries")

    entriesDiv.innerHTML = ""

    data.forEach(entry => {

        const div = document.createElement("div")

        div.className = "entry"

        div.innerHTML = `
            <h4>${entry.title}</h4>
            <p>${entry.content}</p>
        `

        entriesDiv.appendChild(div)
    })
}

</script>

</body>
</html>
