name: Deploy Secure Journal App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy through Bastion to Private App Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            ssh -o StrictHostKeyChecking=no -i ~/journal-key.pem ubuntu@10.0.2.135 "
              cd ~/secure-journal-app &&
              git pull origin main &&
              docker compose down &&
              docker compose up --build -d
            "
